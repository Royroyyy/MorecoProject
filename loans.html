<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f1e3d">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MORECO">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loans – MORECO</title>
  <link rel="stylesheet" href="style.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    .transaction-card{
      background:var(--white);
      border:1px solid var(--border);
      border-radius:var(--radius-lg);
      overflow:hidden;
      margin-bottom:1rem;
      transition:border-color var(--transition);
    }
    .transaction-card:hover{ border-color:var(--border-gold); }
    .txn-card-header{
      padding:1rem 1.25rem;
      border-bottom:1px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
      gap:0.5rem;
    }
    .txn-card-body{ padding:1.1rem 1.25rem; }
    .txn-detail-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:0.75rem;
      margin-bottom:1rem;
    }
    .txn-detail label{
      display:block;
      font-size:0.7rem;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:0.06em;
      color:var(--text-muted);
      margin-bottom:0.2rem;
    }
    .txn-detail span{ font-size:0.88rem; color:var(--text); }
    .qr-section{
      background:var(--white);
      border-radius:var(--radius-md);
      padding:1.25rem;
      text-align:center;
      margin-top:0.75rem;
    }
    .qr-label{ font-size:0.88rem; margin-bottom:0.75rem; }
    .qr-container{
      display:inline-block;
      padding:8px;
      background:var(--white);
      border-radius:8px;
    }
    .qr-container img, .qr-container canvas{ display:block; }
    .calc-box{
      background:rgba(240,180,41,0.06);
      border:1px solid var(--border-gold);
      border-radius:var(--radius-md);
      padding:1.1rem 1.25rem;
      margin-bottom:1.25rem;
    }
    .calc-box h4{
      font-size:0.82rem;
      font-weight:700;
      color:var(--gold);
      margin-bottom:0.75rem;
      text-transform:uppercase;
      letter-spacing:0.06em;
    }
    .calc-row{
      display:flex;
      justify-content:space-between;
      font-size:0.85rem;
      padding:0.3rem 0;
      border-bottom:1px solid rgba(255,255,255,0.05);
    }
    .calc-row:last-child{ border-bottom:none; font-weight:700; color:var(--gold); }
    .calc-row label{ color:var(--text-muted); }
    @media (max-width:600px){ .txn-detail-grid{ grid-template-columns:1fr; } }
    @media (max-width:768px){ .page-inner{ padding:1.25rem 1rem; } }
    @media (max-width:480px){ .txn-detail-grid{ grid-template-columns:1fr; } }
  </style>
</head>
<body>

  <div id="nav-mount"></div>

  <div class="page-header">
    <h1>Loan <span>Application</span></h1>
    <p>Apply for a MORECO loan and track your application status</p>
  </div>

  <div class="page-inner" style="max-width:860px;">

    
    <div style="display:flex; gap:0.5rem; margin-bottom:1.5rem; border-bottom:1px solid var(--border); padding-bottom:0;">
      <button class="cat-tab active" id="tab-apply"   onclick="switchTab('apply')"  style="border-radius:6px 6px 0 0;">Apply</button>
      <button class="cat-tab"        id="tab-history" onclick="switchTab('history')" style="border-radius:6px 6px 0 0;">My Loans</button>
    </div>

    
    <div id="tab-apply-content">

      
      <div class="calc-box" id="calc-box">
        <h4>📊 Loan Calculator</h4>
        <div class="calc-row"><label>Principal Amount</label><span id="calc-amount">₱0.00</span></div>
        <div class="calc-row"><label>Interest Rate</label><span id="calc-rate">2.00% / month</span></div>
        <div class="calc-row"><label>Term</label><span id="calc-term">12 months</span></div>
        <div class="calc-row"><label>Monthly Payment</label><span id="calc-monthly">₱0.00</span></div>
        <div class="calc-row"><label>Total Repayment</label><span id="calc-total">₱0.00</span></div>
      </div>

      <div class="panel">
        <div class="panel-header"><h3>💰 New Loan Application</h3></div>
        <div class="panel-body">
          <div class="form-error"   id="loan-error"></div>
          <div class="form-success" id="loan-success"></div>

          <div class="form-row">
            <div class="form-group">
              <label>Loan Amount (₱) *</label>
              <input type="number" id="loan-amount" placeholder="e.g. 10000"
                     min="500" max="500000" step="100" oninput="updateCalculator()">
              <div class="form-hint">Minimum ₱500 — Maximum ₱500,000</div>
            </div>
            <div class="form-group">
              <label>Term *</label>
              <select id="loan-term" onchange="updateCalculator()">
                <option value="3">3 months</option>
                <option value="6">6 months</option>
                <option value="12" selected>12 months</option>
                <option value="18">18 months</option>
                <option value="24">24 months</option>
                <option value="36">36 months</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label>Purpose of Loan *</label>
            <select id="loan-purpose-type" onchange="togglePurposeField()">
              <option value="">Select purpose</option>
              <option value="Business Capital">Business Capital</option>
              <option value="Medical Emergency">Medical Emergency</option>
              <option value="Education">Education</option>
              <option value="Home Improvement">Home Improvement</option>
              <option value="Livelihood">Livelihood</option>
              <option value="Personal">Personal</option>
              <option value="Other">Other (specify below)</option>
            </select>
          </div>

          <div class="form-group" id="purpose-other-group" style="display:none;">
            <label>Specify Purpose *</label>
            <input type="text" id="loan-purpose-other" placeholder="Describe your loan purpose">
          </div>

          <button class="btn btn-primary btn-full btn-lg" onclick="submitLoan()">
            Submit Loan Application
          </button>

          <div style="font-size:0.78rem; color:var(--text-muted); text-align:center; margin-top:0.75rem;">
            Loans are subject to review and approval by our loan officer. Interest rate: 2% per month.
          </div>
        </div>
      </div>
    </div>

    
    <div id="tab-history-content" style="display:none;">
      <div id="loans-list">
        <div style="text-align:center;padding:2rem;">
          <div class="spinner" style="margin:0 auto;"></div>
        </div>
      </div>
    </div>

  </div>

  <div id="footer-mount"></div>

  <script src="js/main.js"></script>
  <script src="js/install-prompt.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/transactions.js"></script>
  <script>document.getElementById("nav-mount").innerHTML = renderNav("");

document.getElementById("footer-mount").innerHTML = renderFooter();

if (!isLoggedIn()) {
  window.location.href = "login.html?returnTo=loans.html";
}

const user = getCurrentUser();

if (user && user.role === "applicant") {
  showToast("Only full members can apply for loans. Please complete your membership first.", "warning", 6e3);
}

function switchTab(tab) {
  document.querySelectorAll(".cat-tab").forEach(b => b.classList.remove("active"));
  document.getElementById("tab-apply-content").style.display = tab === "apply" ? "block" : "none";
  document.getElementById("tab-history-content").style.display = tab === "history" ? "block" : "none";
  document.getElementById("tab-" + tab).classList.add("active");
  if (tab === "history") loadLoanHistory();
}

function togglePurposeField() {
  const val = document.getElementById("loan-purpose-type").value;
  document.getElementById("purpose-other-group").style.display = val === "Other" ? "block" : "none";
}

function updateCalculator() {
  const amount = parseFloat(document.getElementById("loan-amount").value) || 0;
  const term = parseInt(document.getElementById("loan-term").value) || 12;
  const rate = 2;
  const monthly = calculateMonthlyPayment(amount, rate, term);
  const total = calculateTotalPayment(amount, rate, term);
  document.getElementById("calc-amount").textContent = formatMoney(amount);
  document.getElementById("calc-rate").textContent = `${rate}% / month`;
  document.getElementById("calc-term").textContent = `${term} months`;
  document.getElementById("calc-monthly").textContent = formatMoney(monthly);
  document.getElementById("calc-total").textContent = formatMoney(total);
}

async function submitLoan() {
  const errorEl = document.getElementById("loan-error");
  const successEl = document.getElementById("loan-success");
  errorEl.style.display = "none";
  successEl.style.display = "none";
  const amount = parseFloat(document.getElementById("loan-amount").value);
  const term = parseInt(document.getElementById("loan-term").value);
  const purposeType = document.getElementById("loan-purpose-type").value;
  const purposeOther = document.getElementById("loan-purpose-other").value.trim();
  const purpose = purposeType === "Other" ? purposeOther : purposeType;
  if (!amount || amount < 500) {
    errorEl.textContent = "Please enter a valid loan amount (minimum ₱500).";
    errorEl.style.display = "block";
    return;
  }
  if (!purpose) {
    errorEl.textContent = "Please select or specify the purpose of your loan.";
    errorEl.style.display = "block";
    return;
  }
  const result = await applyLoan({
    amount: amount,
    term_months: term,
    interest_rate: 2,
    purpose: purpose
  });
  if (!result.success) {
    errorEl.textContent = result.message || "Failed to submit. Please try again.";
    errorEl.style.display = "block";
    return;
  }
  successEl.textContent = "Loan application submitted! The loan officer will review your application within 3–5 business days.";
  successEl.style.display = "block";
  showToast("Loan application submitted!", "success");
  setTimeout(() => switchTab("history"), 2e3);
}

async function loadLoanHistory() {
  const listEl = document.getElementById("loans-list");
  const result = await getLoans();
  if (!result.success) {
    listEl.innerHTML = emptyState("⚠️", "Failed to load loans.");
    return;
  }
  const loans = result.data.loans || [];
  if (!loans.length) {
    listEl.innerHTML = emptyState("💰", "You have no loan applications yet.");
    return;
  }
  listEl.innerHTML = loans.map(l => renderLoanCard(l, true)).join("");
  renderAllQRCodes(loans, []);
}

updateCalculator();

loadNotifBadge();</script>
  <script>if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").then(reg => console.log("MORECO SW registered:", reg.scope)).catch(err => console.warn("MORECO SW registration failed:", err));
  });
}</script>
</body>
</html>
